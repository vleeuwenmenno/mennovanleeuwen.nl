apply plugin: 'com.android.application'

// -PmvlosTest: a build for the emulator checks only (trusts user CAs in debug, cloud WebView
// debuggable). The APK handed to users is built without it.
def mvlosTest = project.hasProperty('mvlosTest')
// -PmvlosPush: native push notifications (Firebase Cloud Messaging) compiled in. Needs google-services.json
// to do anything at run time; without it the code stays inert. The plain build has inert stand-ins.
def mvlosPush = project.hasProperty('mvlosPush')

android {
    namespace = "nl.mvlos.experiment"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nl.mvlos.experiment"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName mvlosTest ? "1.5-test" : "1.5"
        manifestPlaceholders = [networkSecurityConfig: mvlosTest ? "@xml/network_security_config_test" : "@xml/network_security_config"]
        buildConfigField "boolean", "MVLOS_TEST", mvlosTest ? "true" : "false"
        // Servers whose sign-in may use Android's own Google account picker (comma-separated origins).
        // Their Google Cloud project must have an Android OAuth client for this package and signing
        // key; every other server keeps the browser flow.
        // Servers this build may register for push with (comma-separated origins; checked before anything is sent).
        buildConfigField "String", "PUSH_ORIGINS", "\"" + (project.findProperty('mvlosPushOrigins') ?: 'https://mennovanleeuwen.nl') + "\""
        buildConfigField "boolean", "PUSH_COMPILED", mvlosPush ? "true" : "false"
        buildConfigField "String", "NATIVE_GOOGLE_ORIGINS", "\"" + (project.findProperty('mvlosNativeGoogleOrigins') ?: 'https://mennovanleeuwen.nl') + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // The test-only network config (user CAs in debug) exists only in -PmvlosTest builds.
    if (mvlosTest) sourceSets.main.res.srcDirs += 'src/mvlosTest/res'
    sourceSets.main.java.srcDirs += mvlosPush ? 'src/push/java' : 'src/nopush/java'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    if (mvlosPush) {
        // Push: Firebase Cloud Messaging only (no Analytics) and WorkManager for the content fetch.
        implementation platform('com.google.firebase:firebase-bom:33.16.0')
        implementation 'com.google.firebase:firebase-messaging'
        implementation 'androidx.work:work-runtime:2.10.2'
    }
    // Native Google sign-in: Android Credential Manager with Sign in with Google.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
