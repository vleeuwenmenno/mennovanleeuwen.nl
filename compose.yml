# Runs the site in Docker.
#   docker compose up -d                 pull the released image and start it (as on the server)
#   docker compose up -d --build         build this checkout instead
#   docker compose watch                 build this checkout and rebuild it whenever a file changes
#   docker compose --profile dev up dev  Vite dev server: instant reload on every save
# .env next to this file can set PORT (default 8080), DEV_PORT (default 5173) and GITHUB_TOKEN
# (optional, for `git log` in the terminal).
services:
  site:
    image: ghcr.io/vleeuwenmenno/mennovanleeuwen.nl:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # `docker compose watch`: a production build, rebuilt and restarted when sources change.
    develop:
      watch:
        - { action: rebuild, path: ./src }
        - { action: rebuild, path: ./public }
        - { action: rebuild, path: ./server }
        - { action: rebuild, path: ./pwa }
        - { action: rebuild, path: ./index.html }
        - { action: rebuild, path: ./vite.config.ts }
        - { action: rebuild, path: ./package.json }

  # The checkout mounted into a Vite dev server: saves show up instantly (hot reload), and the
  # live /api endpoints work as in production. node_modules stays inside the container.
  dev:
    profiles: [dev]
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_pnpm_store:/pnpm-store # pnpm's package store, kept out of the checkout

volumes:
  dev_node_modules:
  dev_pnpm_store:
