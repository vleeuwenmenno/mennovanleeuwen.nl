# Runs the released site in Docker, the same way as on the server. For working on the site use
# `pnpm dev` instead (instant reload); `docker compose up -d --build` is only for checking the
# production image itself.
# .env next to this file can set PORT (default 8080), GITHUB_TOKEN (optional, for `git log` in
# the terminal) and the sign-in settings: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, ADMIN_USERS, MAX_USERS,
# PUBLIC_URL, SESSION_SECRET, GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET for Google Calendar and
# UPDOWN_API_KEY (updown.io's read-only key) for the Status widget and OLLAMA_API_KEY for the
# Agents app (see README; both are the admins' own: other users save theirs in Settings).
services:
  site:
    image: ghcr.io/vleeuwenmenno/mennovanleeuwen.nl:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Anyone with a GitHub account can sign up, up to MAX_USERS accounts (the admin can change
      # that and close sign-up in Settings → Users). ADMIN_USERS are comma-separated logins.
      ADMIN_USERS: ${ADMIN_USERS:-vleeuwenmenno}
      MAX_USERS: ${MAX_USERS:-100}
      # The site's public address (https://mennovanleeuwen.nl). Set it: without it the server
      # trusts each request's Host and X-Forwarded-* headers for OAuth redirects and cookies.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPDOWN_API_KEY: ${UPDOWN_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Web Push for Agents answers (server/webpush.ts). Optional: without them the keys are made
      # once into the data volume. VAPID_SUBJECT defaults to PUBLIC_URL.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    # Sign-in sessions, linked Gitea/Forgejo instances and synced notes.
    volumes:
      - site_data:/app/data

volumes:
  site_data:
