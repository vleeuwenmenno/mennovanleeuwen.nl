# Runs the released site in Docker, the same way as on the server. For working on the site use
# `pnpm dev` instead (instant reload); `docker compose up -d --build` is only for checking the
# production image itself.
# .env next to this file can set PORT (default 8080), GITHUB_TOKEN (optional, for `git log` in
# the terminal) and the sign-in settings: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, ALLOWED_USERS,
# PUBLIC_URL, SESSION_SECRET, GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET for Google Calendar and
# UPDOWN_API_KEY (updown.io's read-only key) for the Status widget and OLLAMA_API_KEY for the
# Agents app (see README; both can be set in Settings instead).
services:
  site:
    image: ghcr.io/vleeuwenmenno/mennovanleeuwen.nl:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_USERS: ${ALLOWED_USERS:-vleeuwenmenno}
      # The site's public address (https://mennovanleeuwen.nl). Set it: without it the server
      # trusts each request's Host and X-Forwarded-* headers for OAuth redirects and cookies.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPDOWN_API_KEY: ${UPDOWN_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    # Sign-in sessions, linked Gitea/Forgejo instances and synced notes.
    volumes:
      - site_data:/app/data

volumes:
  site_data:
